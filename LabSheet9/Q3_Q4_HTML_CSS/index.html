<!DOCTYPE html>
<!-- Q3: Student registration form (HTML)   |   Q4: styled by style.css -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Student Record Management System</h1></header>
  <nav>
    <a href="#">Home</a><a href="#">Add Student</a><a href="#">View Students</a>
    <a href="#">Search Student</a><a href="#">Update Student</a><a href="#">Delete Student</a>
  </nav>

  <div class="container">
    <h2>Student Registration Form</h2>
    <form action="#" method="post">
      <label for="student_id">Student ID</label>
      <input type="text" id="student_id" name="student_id" placeholder="e.g. S107" required>

      <label for="name">Student Name</label>
      <input type="text" id="name" name="name" placeholder="Full name" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="1" max="100" required>

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">-- Select --</option>
        <option>Male</option><option>Female</option><option>Other</option>
      </select>

      <label for="department">Department</label>
      <input type="text" id="department" name="department" placeholder="e.g. MCA" required>

      <label for="marks">Marks</label>
      <input type="number" id="marks" name="marks" min="0" max="100" step="0.01" required>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
