{% extends "base.html" %}
{% block content %}
<h2>Add Student</h2>
{% if msg %}<div class="msg {{ 'success' if ok else 'error' }}">{{ msg }}</div>{% endif %}
<form action="/add" method="post">
  <label>Student ID</label><input type="text" name="student_id" required>
  <label>Student Name</label><input type="text" name="name" required>
  <label>Age</label><input type="number" name="age" min="1" max="100" required>
  <label>Gender</label>
  <select name="gender" required><option value="">-- Select --</option><option>Male</option><option>Female</option><option>Other</option></select>
  <label>Department</label><input type="text" name="department" required>
  <label>Marks</label><input type="number" name="marks" min="0" max="100" step="0.01" required>
  <button type="submit">Submit</button>
</form>
<p><a href="/verify">Verify stored data (JSON)</a></p>
{% endblock %}
